<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    document.documentElement.classList.remove('no-js');
    if (!('IntersectionObserver' in window)) {
      document.documentElement.classList.add('no-io');
    }
  </script>
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  {%- comment -%} Fonts are self-hosted (see _sass/_fonts.scss). Preload the two files every page needs so text paints in the right font first time. {%- endcomment %}
  <link rel="preload" href="{{ '/assets/fonts/inter-normal-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/libre-baskerville-normal-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  {% seo %}
</head>
